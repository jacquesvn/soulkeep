<!doctype html>
<html><head>
<meta charset="utf-8">
<script>window.CONTENT_PATH = location.origin + '/zam/';</script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>window.WH = { debug: () => {}, WebP: { getImageExtension: () => '.webp' } };</script>
<script src="/zam/viewer/viewer.min.js"></script>
<style>html,body{margin:0;background:transparent;overflow:hidden}#mv{width:100vw;height:100vh}</style>
</head><body>
<div id="mv"></div>
<script>
  // ?d=<modelId>&t=<modelType: 8 npc/creature, 16 character>&items=slot:displayId,slot:displayId
  const q = new URLSearchParams(location.search);
  const id = parseInt(q.get('d') || '0', 10);
  const mt = parseInt(q.get('t') || '8', 10);
  const items = (q.get('items') || '').split(',').filter(Boolean).map(p => {
    const parts = p.split(':').map(Number);
    return [parts[0], parts[1]];
  });
  window.report = { made: false };
  try {
    const opts = {
      container: jQuery('#mv'), type: 2, contentPath: window.CONTENT_PATH,
      aspect: window.innerWidth / Math.max(1, window.innerHeight), hd: true,
      models: { type: mt, id: id }
    };
    if (items.length) opts.items = items;
    window.viewer = new ZamModelViewer(opts);
    window.report.made = true;
    window.report.items = items.length;
  } catch (e) { window.report.err = String(e); }
</script>
</body></html>
