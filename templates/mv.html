<!doctype html>
<html><head>
<meta charset="utf-8">
<script>window.CONTENT_PATH = location.origin + '/zam/';</script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>window.WH = { debug: () => {}, WebP: { getImageExtension: () => '.webp' } };</script>
<script src="/zam/viewer/viewer.min.js"></script>
<style>
html,body{margin:0;background:transparent;overflow:hidden}
#mv{width:100vw;height:100vh}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  color:#A79FC8;font:500 12px Barlow,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;
  background:transparent;pointer-events:none;transition:opacity .45s ease;}
#loader.gone{opacity:0;}
.disc{width:52px;height:52px;background:url('/icon-192.png') center/contain no-repeat;
  animation:sigilbreathe 2.2s ease-in-out infinite;}
@keyframes sigilbreathe{0%,100%{filter:drop-shadow(0 0 3px rgba(177,92,255,.4))}50%{filter:drop-shadow(0 0 11px rgba(199,125,255,.75))}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head><body>
<div id="mv"></div>
<div id="loader"><div class="disc"></div><span id="ltext">summoning the model…</span></div>
<script>
  // ?d=<modelId>&t=<modelType: 8 npc/creature, 16 character>&items=slot:displayId,slot:displayId
  const q = new URLSearchParams(location.search);
  const id = parseInt(q.get('d') || '0', 10);
  const mt = parseInt(q.get('t') || '8', 10);
  const items = (q.get('items') || '').split(',').filter(Boolean).map(p => {
    const parts = p.split(':').map(Number);
    return [parts[0], parts[1]];
  });
  window.report = { made: false };
  try {
    const aspect = (window.innerWidth > 0 && window.innerHeight > 0)
      ? window.innerWidth / window.innerHeight : 600 / 400;
    const opts = {
      container: jQuery('#mv'), type: 2, contentPath: window.CONTENT_PATH,
      aspect: aspect, hd: true,
      models: { type: mt, id: id }
    };
    if (items.length) opts.items = items;
    window.viewer = new ZamModelViewer(opts);
    window.report.made = true;
    window.report.items = items.length;
  } catch (e) { window.report.err = String(e); }

  // the beacon: pulse until the actor stands, mourn if it never comes
  const t0 = Date.now();
  const watch = setInterval(() => {
    const r = window.viewer && window.viewer.renderer;
    if (r && (r.actors || []).length > 0) {
      clearInterval(watch);
      setTimeout(() => document.getElementById('loader').classList.add('gone'), 600);
    } else if (Date.now() - t0 > 30000 || (window.report && window.report.err)) {
      clearInterval(watch);
      document.querySelector('#loader .disc').style.display = 'none';
      document.getElementById('ltext').textContent = 'the aether resists — model unavailable';
    }
  }, 250);
</script>
</body></html>
